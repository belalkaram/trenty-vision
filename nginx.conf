# Nginx Configuration for Trenty Vision WhatsApp CRM
server {
    listen 80;
    server_name crm.trentyvision.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name crm.trentyvision.com;

    ssl_certificate /etc/letsencrypt/live/crm.trentyvision.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.trentyvision.com/privkey.pem;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Media uploads limit
    client_max_body_size 64M;

    # Proxy to Node.js / Fastify App
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
    }
}
